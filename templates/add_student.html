{% extends 'base.html' %}
{% block title %}Add Student - Student Management System{% endblock %}

{% block content %}

<!-- ======= PAGE HEADER ======= -->
<div class="page-header">
    <div class="page-header-text">
        <h1 class="page-title">Add New Student</h1>
        <p class="page-subtitle">Fill in the details below to enroll a new student</p>
    </div>
    <a href="{{ url_for('index') }}" class="btn btn-outline">← Back to List</a>
</div>

<!-- ======= ADD STUDENT FORM ======= -->
<div class="form-container">
    <form method="POST" action="{{ url_for('add_student') }}" class="student-form">

        <div class="form-grid">

            <!-- Student Name -->
            <div class="form-group">
                <label for="name" class="form-label">Full Name <span class="required">*</span></label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    class="form-input"
                    placeholder="e.g. Aarav Sharma"
                    required>
            </div>

            <!-- Roll Number -->
            <div class="form-group">
                <label for="roll_no" class="form-label">Roll Number <span class="required">*</span></label>
                <input
                    type="text"
                    id="roll_no"
                    name="roll_no"
                    class="form-input"
                    placeholder="e.g. 21CS001"
                    required>
            </div>

            <!-- Branch -->
            <div class="form-group">
                <label for="branch" class="form-label">Branch / Department <span class="required">*</span></label>
                <select id="branch" name="branch" class="form-input" required>
                    <option value="" disabled selected>Select Branch</option>
                    <option value="Computer Science">Computer Science</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Mechanical Engineering">Mechanical Engineering</option>
                    <option value="Civil Engineering">Civil Engineering</option>
                    <option value="Electrical Engineering">Electrical Engineering</option>
                    <option value="Information Technology">Information Technology</option>
                    <option value="Chemical Engineering">Chemical Engineering</option>
                    <option value="Biotechnology">Biotechnology</option>
                </select>
            </div>

            <!-- Year -->
            <div class="form-group">
                <label for="year" class="form-label">Year of Study <span class="required">*</span></label>
                <select id="year" name="year" class="form-input" required>
                    <option value="" disabled selected>Select Year</option>
                    <option value="1st Year">1st Year</option>
                    <option value="2nd Year">2nd Year</option>
                    <option value="3rd Year">3rd Year</option>
                    <option value="4th Year">4th Year</option>
                </select>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-input"
                    placeholder="e.g. student@example.com">
            </div>

            <!-- Phone -->
            <div class="form-group">
                <label for="phone" class="form-label">Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    class="form-input"
                    placeholder="e.g. 9876543210"
                    maxlength="15">
            </div>

        </div><!-- end .form-grid -->

        <!-- Form Buttons -->
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">✓ Add Student</button>
            <a href="{{ url_for('index') }}" class="btn btn-outline">Cancel</a>
        </div>

    </form>
</div>

{% endblock %}
